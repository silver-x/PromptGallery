<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptGallery - 跨AI模型的高质量Prompt库</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
        }

        /* 导航栏 */
        .navbar {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-links a:hover {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .user-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            color: #000;
            font-weight: bold;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 255, 255, 0.3);
        }

        .btn-outline {
            background: transparent;
            color: #00ffff;
            border: 2px solid #00ffff;
        }

        .btn-outline:hover {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 20px #00ffff;
        }

        /* 主要内容区域 */
        .main-content {
            margin-top: 80px;
            padding: 2rem;
        }

        /* 搜索区域 */
        .search-section {
            text-align: center;
            padding: 4rem 0;
            background: radial-gradient(circle at center, rgba(0, 255, 255, 0.1) 0%, transparent 70%);
        }

        .search-title {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #ffff00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(0, 255, 255, 0.5); }
            to { text-shadow: 0 0 30px rgba(255, 0, 255, 0.8); }
        }

        .search-subtitle {
            font-size: 1.2rem;
            color: #cccccc;
            margin-bottom: 2rem;
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        .search-box {
            width: 100%;
            padding: 1rem 1.5rem;
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 50px;
            color: #ffffff;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .search-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 25px;
            color: #000;
            cursor: pointer;
            font-weight: bold;
        }

        /* 筛选标签 */
        .filter-tags {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 2rem 0;
            flex-wrap: wrap;
        }

        .filter-tag {
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 20px;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-tag:hover,
        .filter-tag.active {
            background: rgba(0, 255, 255, 0.2);
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        /* 瀑布流布局 */
        .gallery-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 0;
        }

        .gallery-grid {
            columns: 4;
            column-gap: 1.5rem;
        }

        @media (max-width: 1200px) {
            .gallery-grid { columns: 3; }
        }

        @media (max-width: 768px) {
            .gallery-grid { columns: 2; }
        }

        @media (max-width: 480px) {
            .gallery-grid { columns: 1; }
        }

        /* Prompt卡片 */
        .prompt-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 15px;
            margin-bottom: 1.5rem;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            break-inside: avoid;
        }

        .prompt-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 255, 255, 0.2);
            border-color: #00ffff;
        }

        .card-image {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.3s ease;
        }

        .prompt-card:hover .card-image {
            transform: scale(1.05);
        }

        .card-content {
            padding: 1rem;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .card-description {
            color: #cccccc;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .ai-model-tag {
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            color: #000;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .card-stats {
            display: flex;
            gap: 1rem;
            color: #888;
            font-size: 0.8rem;
        }

        .card-actions {
            display: flex;
            gap: 0.5rem;
        }

        .action-btn {
            flex: 1;
            padding: 0.5rem;
            border: 1px solid rgba(0, 255, 255, 0.3);
            background: transparent;
            color: #00ffff;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.8rem;
        }

        .action-btn:hover {
            background: rgba(0, 255, 255, 0.1);
            border-color: #00ffff;
        }

        .copy-btn {
            background: linear-gradient(45deg, #00ffff, #ff00ff) !important;
            color: #000 !important;
            border: none !important;
            font-weight: bold;
        }

        /* 加载更多按钮 */
        .load-more {
            text-align: center;
            margin: 3rem 0;
        }

        .load-more-btn {
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            color: #000;
            border: none;
            padding: 1rem 2rem;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .load-more-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 255, 255, 0.3);
        }

        /* 页脚 */
        .footer {
            background: rgba(0, 0, 0, 0.8);
            padding: 2rem;
            text-align: center;
            border-top: 1px solid rgba(0, 255, 255, 0.3);
            margin-top: 4rem;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: #cccccc;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: #00ffff;
        }

        .copyright {
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="logo">PromptGallery</a>
            <ul class="nav-links">
                <li><a href="#">首页</a></li>
                <li><a href="search.html">发现</a></li>
                <li><a href="community.html">社区</a></li>
                <li><a href="#">API</a></li>
            </ul>
            <div class="user-actions">
                <a href="login.html" class="btn btn-outline">登录</a>
                <a href="register.html" class="btn btn-primary">注册</a>
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <main class="main-content">
        <!-- 搜索区域 -->
        <section class="search-section">
            <h1 class="search-title">PromptGallery</h1>
            <p class="search-subtitle">跨AI模型的高质量Prompt库与社区生态</p>
            <div class="search-container">
                <input type="text" class="search-box" placeholder="搜索Prompt、AI模型、风格标签...">
                <button class="search-btn">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </section>

        <!-- 筛选标签 -->
        <section class="filter-tags">
            <div class="filter-tag active">全部</div>
            <div class="filter-tag">Midjourney</div>
            <div class="filter-tag">DALL·E</div>
            <div class="filter-tag">Stable Diffusion</div>
            <div class="filter-tag">ChatGPT</div>
            <div class="filter-tag">Gemini</div>
            <div class="filter-tag">文本生成</div>
            <div class="filter-tag">图像生成</div>
            <div class="filter-tag">视频生成</div>
        </section>

        <!-- 瀑布流画廊 -->
        <section class="gallery-container">
            <div class="gallery-grid" id="promptGallery">
                <!-- Prompt卡片将通过JavaScript动态生成 -->
            </div>
        </section>

        <!-- 加载更多 -->
        <section class="load-more">
            <button class="load-more-btn" onclick="loadMorePrompts()">
                <i class="fas fa-plus"></i> 加载更多
            </button>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-links">
                <a href="#">关于我们</a>
                <a href="#">使用条款</a>
                <a href="#">隐私政策</a>
                <a href="#">API文档</a>
                <a href="#">帮助中心</a>
                <a href="#">联系我们</a>
            </div>
            <div class="copyright">
                © 2025 PromptGallery. All rights reserved.
            </div>
        </div>
    </footer>

    <script>
        // 示例Prompt数据
        const samplePrompts = [
            {
                id: 1,
                title: "赛博朋克城市夜景",
                description: "未来主义城市，霓虹灯闪烁，雨夜氛围，高质量渲染",
                image: "https://picsum.photos/300/400?random=1",
                model: "Midjourney",
                likes: 1234,
                copies: 567,
                prompt: "cyberpunk city at night, neon lights, rain, futuristic architecture --ar 16:9 --v 6"
            },
            {
                id: 2,
                title: "梦幻森林精灵",
                description: "魔法森林中的神秘精灵，发光蝴蝶环绕",
                image: "https://picsum.photos/300/500?random=2",
                model: "DALL·E",
                likes: 892,
                copies: 234,
                prompt: "magical forest fairy with glowing butterflies, ethereal lighting, fantasy art style"
            },
            {
                id: 3,
                title: "商业计划书助手",
                description: "帮助创业者制定详细的商业计划书模板",
                image: "https://picsum.photos/300/350?random=3",
                model: "ChatGPT",
                likes: 2156,
                copies: 1023,
                prompt: "Act as a business plan consultant. Help me create a comprehensive business plan for..."
            },
            {
                id: 4,
                title: "水彩风景画",
                description: "温柔的水彩风格山水画，宁静致远",
                image: "https://picsum.photos/300/450?random=4",
                model: "Stable Diffusion",
                likes: 756,
                copies: 189,
                prompt: "watercolor landscape painting, serene mountains, soft colors, traditional Chinese style"
            },
            {
                id: 5,
                title: "科技产品介绍",
                description: "专业的科技产品营销文案生成器",
                image: "https://picsum.photos/300/380?random=5",
                model: "Gemini",
                likes: 1445,
                copies: 678,
                prompt: "Create compelling product descriptions for tech gadgets, focusing on benefits and features..."
            },
            {
                id: 6,
                title: "抽象艺术创作",
                description: "现代抽象艺术风格，色彩丰富，构图独特",
                image: "https://picsum.photos/300/520?random=6",
                model: "Midjourney",
                likes: 634,
                copies: 145,
                prompt: "abstract modern art, vibrant colors, geometric shapes, contemporary style --ar 1:1"
            }
        ];

        // 渲染Prompt卡片
        function renderPromptCard(prompt) {
            return `
                <div class="prompt-card" onclick="openPromptDetail(${prompt.id})">
                    <img src="${prompt.image}" alt="${prompt.title}" class="card-image">
                    <div class="card-content">
                        <h3 class="card-title">${prompt.title}</h3>
                        <p class="card-description">${prompt.description}</p>
                        <div class="card-meta">
                            <span class="ai-model-tag">${prompt.model}</span>
                            <div class="card-stats">
                                <span><i class="fas fa-heart"></i> ${prompt.likes}</span>
                                <span><i class="fas fa-copy"></i> ${prompt.copies}</span>
                            </div>
                        </div>
                        <div class="card-actions">
                            <button class="action-btn" onclick="event.stopPropagation(); likePrompt(${prompt.id})">
                                <i class="fas fa-heart"></i>
                            </button>
                            <button class="action-btn" onclick="event.stopPropagation(); savePrompt(${prompt.id})">
                                <i class="fas fa-bookmark"></i>
                            </button>
                            <button class="action-btn copy-btn" onclick="event.stopPropagation(); copyPrompt('${prompt.prompt}')">
                                <i class="fas fa-copy"></i> 复制
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // 初始化画廊
        function initGallery() {
            const gallery = document.getElementById('promptGallery');
            const shuffledPrompts = [...samplePrompts, ...samplePrompts, ...samplePrompts].sort(() => Math.random() - 0.5);
            gallery.innerHTML = shuffledPrompts.map(renderPromptCard).join('');
        }

        // 加载更多Prompt
        function loadMorePrompts() {
            const gallery = document.getElementById('promptGallery');
            const morePrompts = samplePrompts.map(prompt => ({
                ...prompt,
                id: prompt.id + Date.now(),
                image: `https://picsum.photos/300/${300 + Math.floor(Math.random() * 300)}?random=${Date.now()}`
            }));
            gallery.innerHTML += morePrompts.map(renderPromptCard).join('');
        }

        // 复制Prompt
        function copyPrompt(prompt) {
            navigator.clipboard.writeText(prompt).then(() => {
                alert('Prompt已复制到剪贴板！');
            });
        }

        // 点赞Prompt
        function likePrompt(id) {
            alert(`已点赞Prompt ${id}`);
        }

        // 收藏Prompt
        function savePrompt(id) {
            alert(`已收藏Prompt ${id}`);
        }

        // 打开Prompt详情
        function openPromptDetail(id) {
            window.location.href = `detail.html?id=${id}`;
        }

        // 筛选标签点击事件
        document.querySelectorAll('.filter-tag').forEach(tag => {
            tag.addEventListener('click', function() {
                document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                // 这里可以添加筛选逻辑
            });
        });

        // 搜索功能
        document.querySelector('.search-box').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const query = this.value;
                window.location.href = `search.html?q=${encodeURIComponent(query)}`;
            }
        });

        document.querySelector('.search-btn').addEventListener('click', function() {
            const query = document.querySelector('.search-box').value;
            window.location.href = `search.html?q=${encodeURIComponent(query)}`;
        });

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initGallery);
    </script>
</body>
</html>
