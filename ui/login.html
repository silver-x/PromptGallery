<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - PromptGallery</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* 背景动画效果 */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(0, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 0, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255, 255, 0, 0.05) 0%, transparent 50%);
            animation: backgroundPulse 8s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes backgroundPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        /* 导航栏 */
        .navbar {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }

        /* 登录容器 */
        .login-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 20px;
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.3),
                0 0 50px rgba(0, 255, 255, 0.1);
            position: relative;
            margin-top: 80px;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #ffff00, #00ffff);
            border-radius: 20px;
            z-index: -1;
            opacity: 0.3;
            animation: borderGlow 3s linear infinite;
        }

        @keyframes borderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 标题 */
        .login-title {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-title h1 {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .login-title p {
            color: #cccccc;
            font-size: 1rem;
        }

        /* 社交登录按钮 */
        .social-login {
            margin-bottom: 2rem;
        }

        .social-buttons {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .social-btn {
            flex: 1;
            padding: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-weight: bold;
            text-decoration: none;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #00ffff;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 255, 255, 0.2);
        }

        .social-btn.google {
            border-color: #db4437;
        }

        .social-btn.google:hover {
            border-color: #db4437;
            box-shadow: 0 10px 20px rgba(219, 68, 55, 0.2);
        }

        .social-btn.github {
            border-color: #333;
        }

        .social-btn.github:hover {
            border-color: #333;
            box-shadow: 0 10px 20px rgba(51, 51, 51, 0.2);
        }

        .social-btn.discord {
            border-color: #5865f2;
        }

        .social-btn.discord:hover {
            border-color: #5865f2;
            box-shadow: 0 10px 20px rgba(88, 101, 242, 0.2);
        }

        /* 分割线 */
        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: #888;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.3), transparent);
        }

        .divider span {
            padding: 0 1rem;
            font-size: 0.9rem;
        }

        /* 表单样式 */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            position: relative;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: #cccccc;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .form-input {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 12px;
            color: #ffffff;
            font-size: 1rem;
            transition: all 0.3s ease;
            position: relative;
        }

        .form-input:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .form-input::placeholder {
            color: #888;
        }

        /* 密码输入框 */
        .password-group {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: #00ffff;
        }

        /* 记住我和忘记密码 */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #cccccc;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #00ffff;
        }

        .forgot-password {
            color: #00ffff;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .forgot-password:hover {
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
        }

        /* 登录按钮 */
        .login-btn {
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            color: #000;
            border: none;
            padding: 1.2rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0, 255, 255, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        /* 注册链接 */
        .register-link {
            text-align: center;
            margin-top: 2rem;
            color: #cccccc;
        }

        .register-link a {
            color: #00ffff;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .register-link a:hover {
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
        }

        /* 错误消息 */
        .error-message {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            color: #ff6b6b;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 加载状态 */
        .loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .loading .login-btn {
            background: #666;
            cursor: not-allowed;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 0.5rem;
        }

        .loading .spinner {
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .login-container {
                margin: 1rem;
                padding: 2rem;
            }
            
            .social-buttons {
                flex-direction: column;
            }
            
            .form-options {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }
        }

        @media (max-width: 480px) {
            .navbar {
                padding: 1rem;
            }
            
            .nav-links {
                display: none;
            }
            
            .login-container {
                padding: 1.5rem;
            }
            
            .login-title h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">PromptGallery</a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="search.html">发现</a></li>
                <li><a href="community.html">社区</a></li>
                <li><a href="#">API</a></li>
            </ul>
        </div>
    </nav>

    <!-- 登录容器 -->
    <div class="login-container">
        <!-- 标题 -->
        <div class="login-title">
            <h1>欢迎回来</h1>
            <p>登录到你的PromptGallery账户</p>
        </div>

        <!-- 错误消息 -->
        <div class="error-message" id="errorMessage">
            <i class="fas fa-exclamation-triangle"></i>
            <span id="errorText">登录失败，请检查用户名和密码</span>
        </div>

        <!-- 社交登录 -->
        <div class="social-login">
            <div class="social-buttons">
                <a href="#" class="social-btn google" onclick="socialLogin('google')">
                    <i class="fab fa-google"></i>
                    Google
                </a>
                <a href="#" class="social-btn github" onclick="socialLogin('github')">
                    <i class="fab fa-github"></i>
                    GitHub
                </a>
                <a href="#" class="social-btn discord" onclick="socialLogin('discord')">
                    <i class="fab fa-discord"></i>
                    Discord
                </a>
            </div>
            
            <div class="divider">
                <span>或使用邮箱登录</span>
            </div>
        </div>

        <!-- 登录表单 -->
        <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label" for="email">邮箱地址</label>
                <input 
                    type="email" 
                    id="email" 
                    class="form-input" 
                    placeholder="输入你的邮箱地址"
                    required
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="password">密码</label>
                <div class="password-group">
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="输入你的密码"
                        required
                    >
                    <button 
                        type="button" 
                        class="password-toggle" 
                        onclick="togglePassword()"
                        aria-label="显示/隐藏密码"
                    >
                        <i class="fas fa-eye" id="passwordIcon"></i>
                    </button>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    记住我
                </label>
                <a href="#" class="forgot-password" onclick="forgotPassword()">忘记密码？</a>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <div class="spinner"></div>
                <span id="loginBtnText">登录</span>
            </button>
        </form>

        <!-- 注册链接 -->
        <div class="register-link">
            还没有账户？ <a href="register.html">立即注册</a>
        </div>
    </div>

    <script>
        // 切换密码显示/隐藏
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('passwordIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                passwordIcon.className = 'fas fa-eye';
            }
        }

        // 社交登录
        function socialLogin(provider) {
            console.log(`使用 ${provider} 登录`);
            // 这里应该跳转到对应的OAuth授权页面
            alert(`跳转到 ${provider} 授权页面`);
        }

        // 忘记密码
        function forgotPassword() {
            const email = prompt('请输入你的邮箱地址，我们将发送重置密码链接：');
            if (email) {
                alert(`密码重置链接已发送到 ${email}`);
            }
        }

        // 显示错误消息
        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            errorText.textContent = message;
            errorMessage.classList.add('show');
            
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 5000);
        }

        // 设置加载状态
        function setLoading(loading) {
            const form = document.getElementById('loginForm');
            const btnText = document.getElementById('loginBtnText');
            
            if (loading) {
                form.classList.add('loading');
                btnText.textContent = '登录中...';
            } else {
                form.classList.remove('loading');
                btnText.textContent = '登录';
            }
        }

        // 表单验证
        function validateForm(email, password) {
            if (!email) {
                showError('请输入邮箱地址');
                return false;
            }
            
            if (!email.includes('@')) {
                showError('请输入有效的邮箱地址');
                return false;
            }
            
            if (!password) {
                showError('请输入密码');
                return false;
            }
            
            if (password.length < 6) {
                showError('密码长度至少6位');
                return false;
            }
            
            return true;
        }

        // 处理登录
        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            
            // 表单验证
            if (!validateForm(email, password)) {
                return;
            }
            
            // 设置加载状态
            setLoading(true);
            
            try {
                // 模拟API调用
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                // 模拟登录逻辑
                if (email === 'demo@promptgallery.com' && password === 'demo123') {
                    // 登录成功
                    if (rememberMe) {
                        localStorage.setItem('rememberMe', 'true');
                        localStorage.setItem('userEmail', email);
                    }
                    
                    alert('登录成功！');
                    window.location.href = 'user-center.html';
                } else {
                    // 登录失败
                    showError('邮箱或密码错误，请重试');
                }
            } catch (error) {
                showError('网络错误，请稍后重试');
            } finally {
                setLoading(false);
            }
        }

        // 页面加载时检查记住我功能
        window.addEventListener('load', () => {
            const rememberMe = localStorage.getItem('rememberMe');
            const userEmail = localStorage.getItem('userEmail');
            
            if (rememberMe === 'true' && userEmail) {
                document.getElementById('email').value = userEmail;
                document.getElementById('rememberMe').checked = true;
            }
        });

        // 键盘快捷键
        document.addEventListener('keydown', (event) => {
            // Enter键提交表单
            if (event.key === 'Enter' && !event.shiftKey) {
                const form = document.getElementById('loginForm');
                if (document.activeElement.tagName === 'INPUT') {
                    form.dispatchEvent(new Event('submit'));
                }
            }
        });
    </script>
</body>
</html>
